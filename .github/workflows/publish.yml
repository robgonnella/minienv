name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  package-binaries:
    if: ${{ github.repository == 'robgonnella/minienv' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        include:
          - ext: ""
          - ext: .exe
            goos: windows
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tooling
      - name: Build Binary for ${{ matrix.goos }}-${{ matrix.goarch }}"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
          -ldflags="-s -w" \
          -trimpath \
          -o build/${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
          cmd/minienv/main.go
      - name: Package
        uses: a7ul/tar-action@v1.2.0
        with:
          command: c
          cwd: ./build
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          outPath: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
          path: build/${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
  update-release:
    if: ${{ github.repository == 'robgonnella/minienv' }}
    runs-on: ubuntu-latest
    needs: package-binaries
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: "*.tgz"
          path: ./dist/
          merge-multiple: true
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.RELEASE_TOKEN }}
          file_glob: true
          file: ./dist/*.tgz
