name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tooling
      - name: Environment Variables Matrix
        run: |
          echo "Building for ${{ matrix.goos }}-${{ matrix.goarch }}"
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # Add .exe extension if building for Windows
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build \
          -ldflags="-s -w" \
          -trimpath \
          -o build/${{ github.event.repository.name }}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
          cmd/minienv/main.go
