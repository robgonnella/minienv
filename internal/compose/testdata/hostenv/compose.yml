x-minienv:
  k8s:
    context: test-context
    namespace: test-namespace

include:
  - sub/compose.yml

services:
  api:
    image: reg/api:v1
    env_file: vars.env
    environment:
      - LITERAL=plain
      - ESCAPED=$$not-a-variable
      - FROM_HOST=${HOST_VALUE}
      - WITH_DEFAULT=${HOSTENV_UNSET_VALUE:-fallback}
      - PASSTHROUGH
      - HOSTENV_UNSET_PASSTHROUGH
    x-minienv-k8s-service:
      env:
        - name: API_KEY
          value: ${HOST_VALUE}
        - name: LOG_LEVEL
          value: debug
  worker:
    image: reg/worker:v1
    environment:
      PORT: 8080
      DEBUG: "true"
      TOKEN: ${HOST_VALUE}
      INHERITED:
  plain:
    image: reg/plain:v1
    environment:
      - ONLY=literal
