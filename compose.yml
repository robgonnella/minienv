# $schema: ./schema/schema.json

x-minienv:
  k8s:
    context: minikube
    namespace: $MINIENV_NAMESPACE
    deploymentTimeout: 15s

services:
  hello:
    x-minienv-k8s-service:
      # ngrok:
      #   port: 8080
      image:
        repository: rgonnella/demo-hello
        tag: +git
        platforms:
          - linux/amd64
          - linux/arm64/v8
    build: .
    ports:
      - 8080:8080
    healthcheck:
      test: curl http://localhost:8080

  postgres:
    # x-minienv-k8s-service:
    #   skip: true
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U postgres -d postgres
