# $schema: ./schema/schema.json

x-minienv:
  k8s:
    context: minikube
    namespace: $MINIENV_NAMESPACE

services:
  echo:
    x-minienv-k8s-service:
      exposeServicePort: 8080
      service:
        ports:
          - containerPortName: http
            containerPort: 80
            servicePortName: http
            servicePort: 8080
            protocol: TCP
    image: ealen/echo-server:latest
    ports:
      - 8080:80
    healthcheck:
      test: curl http://localhost/health

  postgres:
    x-minienv-k8s-service:
      skip: true
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U postgres -d postgres
