# $schema: ./schema/schema.json

x-minienv:
  k8s:
    context: minikube
    namespace: $MINIENV_NAMESPACE
    deploymentTimeout: 15s

services:
  echo:
    x-minienv-k8s-service:
      ngrok:
        port: 8080
    image: ealen/echo-server:latest
    ports:
      - 8080:80
    healthcheck:
      test: curl http://localhost/health

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U postgres -d postgres
