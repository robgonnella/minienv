# $schema: ./schema/schema.json

x-minienv:
  docker:
    namespace: $MINIENV_NAMESPACE
    transport:
      ssh:
        host: 127.0.0.1
        user: $USER
        port: 2220
        identity: ~/.lima/_config/user

services:
  hello:
    x-minienv-docker-service:
      copy:
        - hostPath: ./cmd
          containerPath: /minienv-cmds
        - hostPath: ./schema/schema.json
          containerPath: /etc/schema/schema.json
      image:
        repository: rgonnella/demo-hello
        tag: test-+git
        platforms:
          - linux/amd64
          - linux/arm64/v8
      ngrok:
        port: 8080
    build: .
    ports:
      - 8080:8080
    volumes:
      - test:/etc/test
      - ./schema:/etc/schema
    healthcheck:
      test: curl http://localhost:8080
    depends_on:
      job:
        condition: service_completed_successfully

  hello2:
    x-minienv-docker-service:
      image:
        repository: rgonnella/demo-hello
        tag: latest
        platforms:
          - linux/amd64
          - linux/arm64/v8
      ngrok:
        port: 8080
    build: .
    healthcheck:
      test: curl http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8081:8080

  job:
    x-minienv-docker-service:
      skip: ${SKIP_JOB:-false}
    image: alpine:3.24
    command:
      - /bin/sh
      - -c
      - sleep 10 && echo "ready"
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U postgres -d postgres

volumes:
  test:
